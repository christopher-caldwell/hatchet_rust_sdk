[workspace]
members = [
    "crates/hatchet-core",
    "crates/hatchet-macros",
    "crates/hatchet-sdk",
    "examples/features",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
authors = ["Christopher Caldwell"]
license = "MIT"
repository = "https://github.com/christopher-caldwell/hatchet_rust_sdk"
homepage = "https://github.com/christopher-caldwell/hatchet_rust_sdk"
publish = true
