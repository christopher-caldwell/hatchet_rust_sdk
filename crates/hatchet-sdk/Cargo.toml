[package]
name = "hatchet-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
hatchet-core = { path = "../hatchet-core" }
hatchet-macros = { path = "../hatchet-macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
