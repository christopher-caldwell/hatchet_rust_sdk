[package]
name = "hatchet-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
hatchet-core = { path = "../hatchet-core" }
hatchet-macros = { path = "../hatchet-macros" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt", "sync", "time", "net", "io-util", "fs"] }
tokio-util = "0.7"

# gRPC transport dependencies (feature-gated)
tonic = { version = "0.12", features = ["tls", "tls-roots"], optional = true }
prost = { version = "0.13", optional = true }
prost-types = { version = "0.13", optional = true }
base64 = { version = "0.22", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
base64 = "0.22"

[features]
default = ["grpc"]
grpc = ["dep:tonic", "dep:prost", "dep:prost-types", "dep:base64", "dep:tonic-build", "dep:reqwest"]
integration = []
