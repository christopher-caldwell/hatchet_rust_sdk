[package]
name = "hatchet-railway-multi-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
default-run = "hatchet-railway-multi-node"

[workspace]

[dependencies]
another-hatchet-sdk = { path = "../../crates/hatchet-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tempfile = "3.20"

[lints.clippy]
all = "warn"
pedantic = "warn"
