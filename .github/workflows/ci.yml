name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features
      - name: Test no-default build
        run: cargo test -p another-hatchet-sdk --no-default-features --all-targets
      - name: Strict rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Check standalone Railway example
        run: |
          cargo check --locked --manifest-path examples/multi-node/Cargo.toml --all-targets
          cargo clippy --locked --manifest-path examples/multi-node/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path examples/multi-node/Cargo.toml
      - name: Verify release archives and clean consumer build
        run: scripts/publish-crates.sh --check-only

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85
      - uses: Swatinem/rust-cache@v2
      - name: Check minimum Rust version
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo check --locked --manifest-path examples/multi-node/Cargo.toml --all-targets

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check RustSec advisories
        run: |
          cargo audit
          cargo audit --file examples/multi-node/Cargo.lock
