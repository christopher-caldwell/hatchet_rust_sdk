# Root-context Railway configuration used by the two path-dependent Rust workers.
# The standalone copy under examples/railway-multi-node documents the same policy.
[build]
builder = "DOCKERFILE"
dockerfilePath = "examples/railway-multi-node/Dockerfile"

[deploy]
startCommand = "/app/hatchet-railway-multi-node"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"
sleepApplication = false
